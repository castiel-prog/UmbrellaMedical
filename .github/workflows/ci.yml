   name: CI

   on:
     push:
       branches: [ main, master ]
     pull_request:
       branches: [ main, master ]

   jobs:
     build-and-test:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-dotnet@v4
           with:
             dotnet-version: 10.0.x

         - name: Restore
           run: dotnet restore UmbrellaMedical.sln

         - name: Build
           run: dotnet build UmbrellaMedical.sln --configuration Release --no-restore

         - name: Test
           run: dotnet test UmbrellaMedical.sln --configuration Release --no-build --verbosity normal
